name: MVP checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: timeout 180 npm ci --cache "$RUNNER_TEMP/npm-cache"
      - run: timeout 180 npm run check
      - run: timeout 180 node scripts/check-production-install.mjs
      - run: timeout 180 npx playwright install --with-deps chromium
      - run: timeout 180 npm run test:e2e
      - run: timeout 60 npm audit --omit=dev --audit-level=high --cache "$RUNNER_TEMP/npm-cache"
